name: Windows production release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional release notes appended to the generated integrity summary
        required: false
        default: ""
        type: string
      prerelease:
        description: Publish as a prerelease rather than the latest stable release
        required: true
        default: false
        type: boolean
      mandatory_update:
        description: Require immediate upgrade and mark the current version unsupported
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: herfy-windows-production-release
  cancel-in-progress: false

jobs:
  build-sign-and-release:
    runs-on: windows-2022
    timeout-minutes: 150
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Python 3.11 x64
        uses: actions/setup-python@v7
        with:
          python-version: 3.11.9
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-test.txt
            requirements-quality.txt

      - name: Install validation and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install --prefer-binary --only-binary=:all: `
            -r requirements-build.txt `
            -r requirements-test.txt `
            -r requirements-quality.txt
          python -m pip check

      - name: Audit runtime dependencies
        shell: pwsh
        run: python -m pip_audit -r requirements.txt --strict

      - name: Validate source and Windows Qt runtime
        shell: cmd
        run: 00_VALIDATE.cmd

      - name: Read release identity
        id: release_identity
        shell: pwsh
        run: |
          $metadata = Get-Content -Raw -Encoding UTF8 version.json | ConvertFrom-Json
          $version = [string]$metadata.app_version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'version.json does not contain app_version.'
          }
          "app_version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Build, test, sign, and assemble production bundle
        shell: cmd
        env:
          HERFY_REQUIRE_CODE_SIGNING: "1"
          HERFY_SIGNING_CERT_THUMBPRINT: ${{ secrets.HERFY_SIGNING_CERT_THUMBPRINT }}
          HERFY_SIGNING_PFX_BASE64: ${{ secrets.HERFY_SIGNING_PFX_BASE64 }}
          HERFY_SIGNING_PFX_PASSWORD: ${{ secrets.HERFY_SIGNING_PFX_PASSWORD }}
          HERFY_TIMESTAMP_URL: ${{ vars.HERFY_TIMESTAMP_URL }}
          HERFY_MANDATORY_UPDATE: ${{ inputs.mandatory_update && '1' || '0' }}
        run: 00_BUILD_AND_PUBLISH.cmd

      - name: Enforce production release gate
        shell: pwsh
        run: |
          $release = Get-Content -Raw -Encoding UTF8 publish/release.json | ConvertFrom-Json
          if (-not [bool]$release.production) {
            throw 'The assembled bundle is not marked as production.'
          }
          if ([string]$release.release_gate -ne 'windows-build-smoke-and-authenticode-validated') {
            throw "Unexpected release gate: $($release.release_gate)"
          }
          if ([string]$release.validation.code_signing -ne 'passed') {
            throw 'The assembled bundle did not pass code-signing validation.'
          }

      - name: Upload immutable production bundle
        uses: actions/upload-artifact@v7
        with:
          name: HerfyClient-Production-${{ steps.release_identity.outputs.app_version }}
          if-no-files-found: error
          retention-days: 30
          path: publish/**

      - name: Create signed GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $version = '${{ steps.release_identity.outputs.app_version }}'
          $tag = '${{ steps.release_identity.outputs.release_tag }}'
          & gh release view $tag *> $null
          $releaseViewExitCode = $LASTEXITCODE
          if ($releaseViewExitCode -eq 0) {
            throw "GitHub release already exists: $tag"
          }
          if ($releaseViewExitCode -ne 1) {
            throw "Unable to determine whether GitHub release exists: $tag (exit=$releaseViewExitCode)"
          }

          $release = Get-Content -Raw -Encoding UTF8 publish/release.json | ConvertFrom-Json
          $setup = Join-Path 'publish/updates/packages' ([string]$release.installer.file)
          $patch = Join-Path 'publish/updates/packages' ([string]$release.validation_patch.file)
          $source = Join-Path 'publish/source' ([string]$release.editable_source.file)
          $assets = @(
            $setup,
            "$setup.sha256",
            $patch,
            "$patch.sha256",
            $source,
            "$source.sha256",
            'publish/release.json',
            'publish/updates/latest.json',
            'publish/updates/manifest.json',
            'publish/updates/upgrade-plan.json',
            'publish/validation/signing-status.json',
            'publish/validation/publish-bundle-validation.json'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Release asset is missing: $asset"
            }
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "HerfyClient-$version-release-notes.md"
          $notes = @(
            "# Herfy Client $version",
            '',
            'Windows production release passed source validation, frozen-runtime self-checks, installer install/uninstall smoke tests, update-agent patch validation, and Authenticode verification.',
            '',
            "Installer SHA-256: ``$($release.installer.sha256)``",
            "Source SHA-256: ``$($release.editable_source.sha256)``"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) {
            $notes += @('', $env:RELEASE_NOTES.Trim())
          }
          [IO.File]::WriteAllLines($notesPath, $notes, (New-Object System.Text.UTF8Encoding($false)))

          $arguments = @(
            'release', 'create', $tag,
            '--target', $env:GITHUB_SHA,
            '--title', "Herfy Client $version",
            '--notes-file', $notesPath
          )
          if ($env:PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }
          else {
            $arguments += '--latest'
          }
          $arguments += $assets
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub release creation failed.'
          }
