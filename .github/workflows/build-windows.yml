name: Build Herfy Tracking System 2.18.1

on:
  push:
    branches: [main]
    paths:
      - source/**
      - .github/scripts/**
      - .github/workflows/build-windows.yml
  pull_request:
    branches: [main]
    paths:
      - .github/build-trigger-*
      - .github/scripts/**
      - .github/workflows/build-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: herfy-tracking-system-2-18-1
  cancel-in-progress: false

jobs:
  windows-preflight:
    name: Confirm Windows runner
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          Write-Host "HERFY_WINDOWS_RUNNER_OK"

  build-windows:
    name: Build and install-test Windows release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Verify base source
        shell: pwsh
        run: |
          $source = 'source/HerfyTrackingSystem_2.18.0_Client_Source.zip'
          $expected = 'a797c52975530bb3e34b00ef54f000364402f6a5eddf24b3e086af4bfe0d9375'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Missing $source" }
          $actual = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source checksum mismatch. expected=$expected actual=$actual" }
          Write-Host "HERFY_BASE_SOURCE_OK sha256=$actual"

      - name: Prepare clean 2.18.1 source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path prepared -Force | Out-Null
          Expand-Archive -LiteralPath 'source/HerfyTrackingSystem_2.18.0_Client_Source.zip' -DestinationPath client -Force
          python .github/scripts/prepare_release_2_18_1.py client prepared/HerfyTrackingSystem_2.18.1_Client_Source.zip
          $version = Get-Content -LiteralPath client/version.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($version.app_version -ne '2.18.1') { throw "Prepared source version mismatch: $($version.app_version)" }
          if (-not (Test-Path -LiteralPath 'client/tools/build/build.cmd' -PathType Leaf)) { throw 'Missing client build entry point' }
          if (-not (Test-Path -LiteralPath 'client/installer/HerfyTrackingSystem.iss' -PathType Leaf)) { throw 'Missing installer definition' }
          Write-Host "HERFY_PREPARED_SOURCE_OK"

      - name: Build EXE and setup
        id: build
        continue-on-error: true
        shell: pwsh
        working-directory: client
        run: |
          & cmd.exe /d /c tools\build\build.cmd *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install, self-check, and uninstall setup
        id: install_test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $setup = Join-Path $PWD 'client/publish/HerfyTrackingSystem_2.18.1_Setup.exe'
          $installRoot = Join-Path $env:RUNNER_TEMP 'HerfyTrackingSystem-2.18.1-installed'
          $selfCheck = Join-Path $env:RUNNER_TEMP 'installed-self-check.json'
          $notificationCheck = Join-Path $env:RUNNER_TEMP 'installed-notification-check.json'
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          foreach ($path in @($selfCheck, $notificationCheck)) { Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue }
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw "Missing installer: $setup" }

          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installRoot", '/TASKS=')
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)" }

          $app = Join-Path $installRoot 'HerfyTrackingSystem.exe'
          $agent = Join-Path $installRoot 'HerfyTrackingSystemUpdateAgent.exe'
          $uninstaller = Join-Path $installRoot 'unins000.exe'
          foreach ($required in @($app, $agent, $uninstaller)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Installed file missing: $required" }
          }

          & $app --self-check-file $selfCheck
          if ($LASTEXITCODE -ne 0) { throw "Installed application self-check failed: $LASTEXITCODE" }
          & $app --notification-self-check-file $notificationCheck
          if ($LASTEXITCODE -ne 0) { throw "Installed notification self-check failed: $LASTEXITCODE" }
          foreach ($checkPath in @($selfCheck, $notificationCheck)) {
            $check = Get-Content -LiteralPath $checkPath -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($check.status -ne 'ok' -or @($check.errors).Count -ne 0) { throw "Installed runtime self-check reported errors: $checkPath" }
          }

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 3
          foreach ($removed in @($app, $agent)) {
            if (Test-Path -LiteralPath $removed) { throw "Stale installed runtime remains after uninstall: $removed" }
          }
          Write-Host "HERFY_INSTALL_UNINSTALL_OK"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HerfyTrackingSystem-2.18.1-Diagnostics
          path: |
            client/build.log
            client/publish/*
            prepared/*
          if-no-files-found: warn
          retention-days: 30

      - name: Require build and installation tests
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.build.outcome }}' -ne 'success') { throw 'Windows build failed' }
          if ('${{ steps.install_test.outcome }}' -ne 'success') { throw 'Installer acceptance test failed' }
          Write-Host 'HERFY_WINDOWS_ACCEPTANCE_OK'

      - name: Collect and verify release files
        shell: pwsh
        working-directory: client
        run: |
          $release = Join-Path $PWD 'release'
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          $setup = Join-Path $PWD 'publish/HerfyTrackingSystem_2.18.1_Setup.exe'
          $manifest = Join-Path $PWD 'publish/client-update-manifest.json'
          $runtime = Join-Path $env:LOCALAPPDATA 'HerfyTrackingSystem/Build/2.18.1/dist/HerfyTrackingSystem'
          $preparedSource = Join-Path (Split-Path $PWD -Parent) 'prepared/HerfyTrackingSystem_2.18.1_Client_Source.zip'
          foreach ($required in @($setup, $manifest, $preparedSource)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing release input: $required" }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $runtime 'HerfyTrackingSystem.exe') -PathType Leaf)) { throw "Missing application executable in $runtime" }
          if (-not (Test-Path -LiteralPath (Join-Path $runtime 'HerfyTrackingSystemUpdateAgent.exe') -PathType Leaf)) { throw "Missing update agent executable in $runtime" }

          Copy-Item -LiteralPath $setup -Destination (Join-Path $release 'HerfyTrackingSystem_2.18.1_Setup.exe') -Force
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $release 'client-update-manifest.json') -Force
          Copy-Item -LiteralPath $preparedSource -Destination (Join-Path $release 'HerfyTrackingSystem_2.18.1_Client_Source.zip') -Force
          Copy-Item -LiteralPath (Join-Path $runtime 'HerfyTrackingSystem.exe') -Destination (Join-Path $release 'HerfyTrackingSystem_2.18.1.exe') -Force
          Compress-Archive -Path (Join-Path $runtime '*') -DestinationPath (Join-Path $release 'HerfyTrackingSystem_2.18.1_Portable.zip') -Force

          $manifestData = Get-Content -LiteralPath $manifest -Raw -Encoding UTF8 | ConvertFrom-Json
          $setupHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifestData.version -ne '2.18.1') { throw "Unexpected manifest version: $($manifestData.version)" }
          if ($manifestData.installer -ne 'HerfyTrackingSystem_2.18.1_Setup.exe') { throw "Unexpected installer name: $($manifestData.installer)" }
          if ($manifestData.sha256 -ne $setupHash) { throw 'Installer checksum does not match client-update-manifest.json' }
          if ([int64]$manifestData.size -ne (Get-Item -LiteralPath $setup).Length) { throw 'Installer size does not match client-update-manifest.json' }

          Get-ChildItem -LiteralPath $release -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)"
          } | Set-Content -LiteralPath (Join-Path $release 'SHA256SUMS.txt') -Encoding ascii
          Get-ChildItem -LiteralPath $release -File | Format-Table Name, Length
          Write-Host "HERFY_WINDOWS_RELEASE_OK setup_sha256=$setupHash"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: HerfyTrackingSystem-2.18.1-Windows
          path: client/release/*
          if-no-files-found: error
          retention-days: 30
