name: Build Herfy Tracking System 2.18.2

on:
  push:
    branches: [main, build-2.18.0-final]
    paths:
      - source/**
      - .github/scripts/**
      - .github/workflows/build-windows.yml
  pull_request:
    branches: [main]
    paths:
      - source/**
      - .github/scripts/**
      - .github/workflows/build-windows.yml
  workflow_dispatch:
    inputs:
      deploy_to_server:
        description: Upload the verified release directly to the Herfy update server
        required: true
        type: boolean
        default: false
      mandatory_update:
        description: Publish the client update as mandatory
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: herfy-tracking-system-2-18-2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build, install-test, package, and optionally deploy Windows 2.18.2
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidate = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
            if (-not (Test-Path -LiteralPath $candidate)) { throw 'Inno Setup compiler was not installed' }
            Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $candidate -Parent)
          }

      - name: Verify uploaded source archive
        shell: pwsh
        run: |
          $source = 'source/HerfyTrackingSystem_2.18.0_Client_FINAL_BUILD_SOURCE.zip'
          $expected = '78cb8baef9a73c694776e2046d4adf44431118dc10930aa7c32ed2fe8d65ebd6'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Missing $source" }
          $actual = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source checksum mismatch. expected=$expected actual=$actual" }
          Write-Host "HERFY_SOURCE_ARCHIVE_OK sha256=$actual"

      - name: Extract and prepare clean 2.18.2 source
        shell: pwsh
        run: |
          Remove-Item client, extracted, prepared -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path extracted, prepared | Out-Null
          Expand-Archive -LiteralPath 'source/HerfyTrackingSystem_2.18.0_Client_FINAL_BUILD_SOURCE.zip' -DestinationPath extracted -Force
          $entries = @(Get-ChildItem -LiteralPath extracted -Force)
          if ($entries.Count -eq 1 -and $entries[0].PSIsContainer) {
            Move-Item -LiteralPath $entries[0].FullName -Destination client
          } else {
            New-Item -ItemType Directory -Path client | Out-Null
            Get-ChildItem -LiteralPath extracted -Force | Move-Item -Destination client
          }
          python .github/scripts/prepare_release_2_18_2.py client prepared/HerfyTrackingSystem_2.18.2_Client_Source.zip
          $version = Get-Content -LiteralPath client/version.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($version.app_version -ne '2.18.2') { throw "Prepared source version mismatch: $($version.app_version)" }
          foreach ($required in @('client/tools/build/build.cmd', 'client/tools/build/build.ps1', 'client/installer/HerfyTrackingSystem.iss')) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing build input: $required" }
          }
          Write-Host 'HERFY_2_18_2_SOURCE_PREPARED'

      - name: Run source verification
        shell: pwsh
        working-directory: client
        run: |
          python -m compileall -q .
          python -m pytest -q
          python build/tools/verify/verify_project.py

      - name: Build application, update agent, and custom setup
        id: build
        shell: pwsh
        working-directory: client
        run: |
          if (Test-Path -LiteralPath 'BUILD.ps1') {
            & .\BUILD.ps1 -Clean *>&1 | Tee-Object -FilePath build.log
          } else {
            & cmd.exe /d /c tools\build\build.cmd *>&1 | Tee-Object -FilePath build.log
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install, self-check, and uninstall custom setup
        shell: pwsh
        run: |
          $setup = Join-Path $PWD 'client/publish/HerfyTrackingSystem_2.18.2_Setup.exe'
          $installRoot = Join-Path $env:RUNNER_TEMP 'HerfyTrackingSystem-2.18.2-installed'
          $selfCheck = Join-Path $env:RUNNER_TEMP 'installed-self-check.json'
          $notificationCheck = Join-Path $env:RUNNER_TEMP 'installed-notification-check.json'
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $selfCheck, $notificationCheck -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw "Missing installer: $setup" }
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installRoot",'/TASKS=') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)" }
          $app = Join-Path $installRoot 'HerfyTrackingSystem.exe'
          $agent = Join-Path $installRoot 'HerfyTrackingSystemUpdateAgent.exe'
          $uninstaller = Join-Path $installRoot 'unins000.exe'
          foreach ($required in @($app,$agent,$uninstaller)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Installed file missing: $required" }
          }
          & $app --self-check-file $selfCheck
          if ($LASTEXITCODE -ne 0) { throw "Installed application self-check failed: $LASTEXITCODE" }
          & $app --notification-self-check-file $notificationCheck
          if ($LASTEXITCODE -ne 0) { throw "Installed notification self-check failed: $LASTEXITCODE" }
          foreach ($checkPath in @($selfCheck,$notificationCheck)) {
            $check = Get-Content -LiteralPath $checkPath -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($check.status -ne 'ok' -or @($check.errors).Count -ne 0) { throw "Installed runtime self-check reported errors: $checkPath" }
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 3
          foreach ($removed in @($app,$agent)) {
            if (Test-Path -LiteralPath $removed) { throw "Stale installed runtime remains after uninstall: $removed" }
          }
          Write-Host 'HERFY_2_18_2_INSTALL_UNINSTALL_OK'

      - name: Collect and verify release files
        shell: pwsh
        working-directory: client
        run: |
          $release = Join-Path $PWD 'release'
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          $setup = Join-Path $PWD 'publish/HerfyTrackingSystem_2.18.2_Setup.exe'
          $manifest = Join-Path $PWD 'publish/client-update-manifest.json'
          $runtime = Join-Path $env:LOCALAPPDATA 'HerfyTrackingSystem/Build/2.18.2/dist/HerfyTrackingSystem'
          $preparedSource = Join-Path (Split-Path $PWD -Parent) 'prepared/HerfyTrackingSystem_2.18.2_Client_Source.zip'
          foreach ($required in @($setup,$manifest,$preparedSource)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing release input: $required" }
          }
          foreach ($required in @('HerfyTrackingSystem.exe','HerfyTrackingSystemUpdateAgent.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $runtime $required) -PathType Leaf)) { throw "Missing runtime file: $required" }
          }
          Copy-Item -LiteralPath $setup -Destination (Join-Path $release 'HerfyTrackingSystem_2.18.2_Setup.exe') -Force
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $release 'client-update-manifest.json') -Force
          Copy-Item -LiteralPath $preparedSource -Destination (Join-Path $release 'HerfyTrackingSystem_2.18.2_Client_Source.zip') -Force
          Copy-Item -LiteralPath (Join-Path $runtime 'HerfyTrackingSystem.exe') -Destination (Join-Path $release 'HerfyTrackingSystem_2.18.2.exe') -Force
          Compress-Archive -Path (Join-Path $runtime '*') -DestinationPath (Join-Path $release 'HerfyTrackingSystem_2.18.2_Portable.zip') -Force
          $manifestData = Get-Content -LiteralPath $manifest -Raw -Encoding UTF8 | ConvertFrom-Json
          $setupHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifestData.version -ne '2.18.2') { throw "Unexpected manifest version: $($manifestData.version)" }
          if ($manifestData.installer -ne 'HerfyTrackingSystem_2.18.2_Setup.exe') { throw "Unexpected installer name: $($manifestData.installer)" }
          if ($manifestData.sha256 -ne $setupHash) { throw 'Installer checksum does not match client-update-manifest.json' }
          if ([int64]$manifestData.size -ne (Get-Item -LiteralPath $setup).Length) { throw 'Installer size does not match client-update-manifest.json' }
          Get-ChildItem -LiteralPath $release -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $($_.Path | Split-Path -Leaf)"
          } | Set-Content -LiteralPath (Join-Path $release 'SHA256SUMS.txt') -Encoding ascii
          Get-ChildItem -LiteralPath $release -File | Format-Table Name,Length
          Write-Host "HERFY_2_18_2_WINDOWS_RELEASE_OK setup_sha256=$setupHash"

      - name: Prepare SSH deployment identity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_server }}
        shell: pwsh
        env:
          HERFY_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.HERFY_DEPLOY_SSH_PRIVATE_KEY }}
          HERFY_DEPLOY_HOST: ${{ secrets.HERFY_DEPLOY_HOST }}
          HERFY_DEPLOY_PORT: ${{ secrets.HERFY_DEPLOY_PORT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HERFY_DEPLOY_SSH_PRIVATE_KEY)) { throw 'Missing HERFY_DEPLOY_SSH_PRIVATE_KEY secret' }
          if ([string]::IsNullOrWhiteSpace($env:HERFY_DEPLOY_HOST)) { throw 'Missing HERFY_DEPLOY_HOST secret' }
          $sshDir = Join-Path $HOME '.ssh'
          New-Item -ItemType Directory -Path $sshDir -Force | Out-Null
          $keyPath = Join-Path $sshDir 'herfy_deploy_key'
          $env:HERFY_DEPLOY_SSH_PRIVATE_KEY.Replace("`r", '') | Set-Content -LiteralPath $keyPath -NoNewline -Encoding ascii
          $port = if ([string]::IsNullOrWhiteSpace($env:HERFY_DEPLOY_PORT)) { '22' } else { $env:HERFY_DEPLOY_PORT }
          ssh-keyscan -p $port $env:HERFY_DEPLOY_HOST | Add-Content -LiteralPath (Join-Path $sshDir 'known_hosts') -Encoding ascii
          "HERFY_SSH_KEY=$keyPath" | Add-Content -LiteralPath $env:GITHUB_ENV
          "HERFY_SSH_PORT=$port" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Deploy verified release directly to Herfy update server
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_server }}
        shell: pwsh
        env:
          HERFY_DEPLOY_HOST: ${{ secrets.HERFY_DEPLOY_HOST }}
          HERFY_DEPLOY_USER: ${{ secrets.HERFY_DEPLOY_USER }}
          HERFY_UPDATE_ROOT: ${{ secrets.HERFY_UPDATE_ROOT }}
          HERFY_PUBLIC_BASE_URL: ${{ secrets.HERFY_PUBLIC_BASE_URL }}
          HERFY_MANDATORY_UPDATE: ${{ inputs.mandatory_update }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HERFY_DEPLOY_USER)) { throw 'Missing HERFY_DEPLOY_USER secret' }
          $updateRoot = if ([string]::IsNullOrWhiteSpace($env:HERFY_UPDATE_ROOT)) { '/opt/herfy-server/current/updates' } else { $env:HERFY_UPDATE_ROOT }
          $publicBase = if ([string]::IsNullOrWhiteSpace($env:HERFY_PUBLIC_BASE_URL)) { 'https://herfy.online/updates' } else { $env:HERFY_PUBLIC_BASE_URL.TrimEnd('/') }
          $remoteStage = "/tmp/herfy-client-2.18.2-$env:GITHUB_RUN_ID"
          $target = "$env:HERFY_DEPLOY_USER@$env:HERFY_DEPLOY_HOST"
          ssh -i $env:HERFY_SSH_KEY -p $env:HERFY_SSH_PORT $target "mkdir -p '$remoteStage'"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create remote staging directory' }
          scp -i $env:HERFY_SSH_KEY -P $env:HERFY_SSH_PORT client/release/* "${target}:$remoteStage/"
          if ($LASTEXITCODE -ne 0) { throw 'SCP upload failed' }
          $mandatory = if ($env:HERFY_MANDATORY_UPDATE -eq 'true') { 'true' } else { 'false' }
          $remoteScript = @'
set -euo pipefail
stage="$1"
root="$2"
base_url="$3"
mandatory="$4"
version="2.18.2"
installer="HerfyTrackingSystem_2.18.2_Setup.exe"
version_dir="$root/$version"
packages_dir="$root/packages"
mkdir -p "$version_dir" "$packages_dir"
test -f "$stage/$installer"
test -f "$stage/client-update-manifest.json"
test -f "$stage/SHA256SUMS.txt"
sha="$(sha256sum "$stage/$installer" | awk '{print $1}')"
size="$(stat -c %s "$stage/$installer")"
manifest_sha="$(python3 - "$stage/client-update-manifest.json" <<'PY'
import json,sys
print(json.load(open(sys.argv[1],encoding='utf-8'))['sha256'])
PY
)"
manifest_size="$(python3 - "$stage/client-update-manifest.json" <<'PY'
import json,sys
print(json.load(open(sys.argv[1],encoding='utf-8'))['size'])
PY
)"
test "$sha" = "$manifest_sha"
test "$size" = "$manifest_size"
install -o root -g www-data -m 0640 "$stage/$installer" "$version_dir/$installer"
install -o root -g www-data -m 0640 "$stage/$installer" "$packages_dir/$installer"
for file in client-update-manifest.json SHA256SUMS.txt HerfyTrackingSystem_2.18.2_Portable.zip HerfyTrackingSystem_2.18.2_Client_Source.zip HerfyTrackingSystem_2.18.2.exe; do
  if [ -f "$stage/$file" ]; then install -o root -g www-data -m 0640 "$stage/$file" "$version_dir/$file"; fi
done
python3 - "$root" "$version" "$installer" "$sha" "$size" "$base_url" "$mandatory" <<'PY'
import json, os, sys, tempfile
root, version, installer, sha256, size, base_url, mandatory = sys.argv[1:]
mandatory_bool = mandatory.lower() == 'true'
url = f"{base_url}/{version}/{installer}"
payloads = {
  'latest.json': {
    'version': version,
    'installer': installer,
    'url': url,
    'sha256': sha256,
    'size': int(size),
    'mandatory': mandatory_bool,
  },
  'manifest.json': {
    'version': version,
    'installer': installer,
    'url': url,
    'sha256': sha256,
    'size': int(size),
    'mandatory': mandatory_bool,
  },
  'integrity.json': {
    'version': version,
    'files': {installer: {'sha256': sha256, 'size': int(size)}},
  },
  'upgrade-plan.json': {
    'version': version,
    'mandatory': mandatory_bool,
    'installer': installer,
    'url': url,
  },
}
for name, payload in payloads.items():
    fd, tmp = tempfile.mkstemp(prefix=f'.{name}.', dir=root)
    try:
        with os.fdopen(fd, 'w', encoding='utf-8') as handle:
            json.dump(payload, handle, ensure_ascii=False, indent=2)
            handle.write('\n')
            handle.flush()
            os.fsync(handle.fileno())
        os.chmod(tmp, 0o640)
        os.replace(tmp, os.path.join(root, name))
    finally:
        if os.path.exists(tmp): os.unlink(tmp)
PY
chown root:www-data "$root/latest.json" "$root/manifest.json" "$root/integrity.json" "$root/upgrade-plan.json"
chmod 0640 "$root/latest.json" "$root/manifest.json" "$root/integrity.json" "$root/upgrade-plan.json"
nginx -t
systemctl reload nginx
curl --fail --silent --show-error "$base_url/latest.json" >/tmp/herfy-latest.json
python3 - /tmp/herfy-latest.json "$version" "$sha" <<'PY'
import json,sys
payload=json.load(open(sys.argv[1],encoding='utf-8'))
assert payload['version']==sys.argv[2], payload
assert payload['sha256']==sys.argv[3], payload
PY
curl --fail --silent --show-error --range 0-1023 "$base_url/$version/$installer" >/dev/null
rm -rf "$stage" /tmp/herfy-latest.json
printf 'HERFY_SERVER_DEPLOYMENT_OK version=%s sha256=%s\n' "$version" "$sha"
'@
          $scriptPath = Join-Path $env:RUNNER_TEMP 'deploy-herfy-release.sh'
          $remoteScript.Replace("`r`n", "`n") | Set-Content -LiteralPath $scriptPath -NoNewline -Encoding utf8
          scp -i $env:HERFY_SSH_KEY -P $env:HERFY_SSH_PORT $scriptPath "${target}:$remoteStage/deploy.sh"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload deployment script' }
          ssh -i $env:HERFY_SSH_KEY -p $env:HERFY_SSH_PORT $target "sudo bash '$remoteStage/deploy.sh' '$remoteStage' '$updateRoot' '$publicBase' '$mandatory'"
          if ($LASTEXITCODE -ne 0) { throw 'Remote deployment verification failed' }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HerfyTrackingSystem-2.18.2-Diagnostics
          path: |
            client/build.log
            client/publish/*
            prepared/*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: HerfyTrackingSystem-2.18.2-Windows
          path: client/release/*
          if-no-files-found: error
          retention-days: 30
