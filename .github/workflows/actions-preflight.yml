name: Actions Free Runner Preflight

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm free hosted runner
        run: |
          echo HERFY_GITHUB_ACTIONS_FREE_RUNNER_OK
          uname -a
